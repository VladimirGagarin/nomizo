<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        var storedTheme = localStorage.getItem('nomizo-theme')
        document.documentElement.dataset.theme = storedTheme === 'light' || storedTheme === 'dark'
          ? storedTheme
          : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
      } catch (error) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0c09" />

      name="description"
      content="Explore Socratic questioning, Stoicism, empiricism and pragmatism as practical tools for examining belief, knowledge and human nature."
    />
