<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        var storedTheme = localStorage.getItem('nomizo-theme')
        document.documentElement.dataset.theme = storedTheme === 'light' || storedTheme === 'dark'
          ? storedTheme
          : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
      } catch (error) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0c09" />
    <meta
      name="description"
      content="A fresh everyday question each day. Choose an answer, examine your reasoning and learn why the obvious option is not always the right one."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Daily Question — Think Before You Answer | NOMIZO" />
    <meta
      property="og:description"
      content="A fresh everyday question each day. Choose an answer, examine your reasoning and think again."
    />
    <meta property="og:url" content="/daily-question/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Daily Question — NOMIZO" />
    <meta name="twitter:description" content="Think before you answer." />
    <title>Daily Question — Think Before You Answer | NOMIZO</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
