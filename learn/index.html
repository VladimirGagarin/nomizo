<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        var storedTheme = localStorage.getItem('nomizo-theme')
        document.documentElement.dataset.theme = storedTheme === 'light' || storedTheme === 'dark'
          ? storedTheme
          : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
      } catch (error) {
        document.documentElement.dataset.theme = 'dark'
      }
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0c09" />
    <meta
      name="description"
      content="Structured courses in reasoning, judgement and practical philosophy. Build thinking skills step by step without memorising answers."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Learn — Courses in Clear Thinking | NOMIZO" />
    <meta
      property="og:description"
      content="Short, structured courses that teach the method of clear thinking instead of a list of answers."
    />
    <meta property="og:url" content="/learn/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Learn — NOMIZO" />
    <meta name="twitter:description" content="Learn the method. Don’t memorise. Understand." />
    <title>Learn — Courses in Clear Thinking | NOMIZO</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
